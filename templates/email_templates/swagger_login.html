<!DOCTYPE html>
<html>
<head>
    <title>Units Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4faff;
            color: #111827;
        }

        .header {
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 26px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #1d4ed8;
        }

        .main {
            display: flex;
            min-height: calc(100vh - 60px);
            align-items: center;
            justify-content: center;
            gap: 90px;
            padding: 40px;
        }

        .left {
            width: 360px;
        }

        .badge {
            display: inline-block;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 18px;
            background: #fff;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .left h2 {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.5;
        }

        .left h2 span {
            color: #0b46ff;
        }

        .card {
            background: #fff;
            width: 450px;
            padding: 28px 26px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .card p {
            margin-bottom: 28px;
            color: #374151;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dbe3ea;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-bottom: 14px;
        }

        button {
            width: 100%;
            border: none;
            background: linear-gradient(90deg, #1d4ed8, #06b6d4);
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo"><span>▣</span> Units</div>
    </div>

    <div class="main">
        <div class="left">
            <div class="badge">PROPERTY MANAGEMENT</div>
            <h2>
                Manage Your Properties With<br>
                <span>Ease And Transparency</span>
            </h2>
        </div>

        <div class="card">
            <h2>Sign In</h2>
            <p>Please enter your info to sign in to units.</p>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="error">
                        Invalid username or password.
                    </div>
                {% endif %}

                <label>Email Address</label>
                <input type="text" name="username" placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>

                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
